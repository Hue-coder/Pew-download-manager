[workspace]
resolver = "2"
members = [
    "crates/pew-core",
    "crates/pew-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hue-coder"]
license = "MIT"
repository = "https://github.com/Hue-coder/Pew-download-manager"

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
futures-util = "0.3"
bytes = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
url = "2.5"
urlencoding = "2.1"
