<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pew Media Grabber</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .header {
      padding: 12px 16px;
      background: #070a12;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      font-size: 18px;
      color: #06b6d4;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .app-status {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    
    /* Top action banner to open desktop app */
    .app-banner {
      padding: 8px 12px;
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.15), rgba(139, 92, 246, 0.15));
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .banner-text {
      font-size: 11px;
      color: #94a3b8;
    }
    .btn-open-app {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #ffffff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: filter 0.2s;
    }
    .btn-open-app:hover {
      filter: brightness(1.15);
    }

    .media-list {
      padding: 10px;
      max-height: 440px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .media-card {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s;
    }
    .media-card:hover {
      border-color: #06b6d4;
    }
    .media-title {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .tag-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag-quality {
      background: #06b6d4;
      color: #041017;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .tag-format {
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .size {
      color: #94a3b8;
    }
    .save-to {
      font-size: 10px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .action-group {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .btn-dl {
      flex: 1;
      background: #06b6d4;
      color: #041017;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-dl:hover { background: #38bdf8; }
    .btn-copy {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-copy:hover { background: #334155; color: #fff; }
    
    .empty-box {
      padding: 40px 20px;
      text-align: center;
      color: #64748b;
    }
    .empty-icon { font-size: 32px; margin-bottom: 8px; }
    .empty-box p { font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-title">Pew Grabber</span>
    </div>
    <div class="app-status status-offline" id="app-status-badge">
      <span class="status-dot"></span>
      <span id="app-status-text">Checking App...</span>
    </div>
  </div>

  <div class="app-banner">
    <span class="banner-text">Desktop download queue ready</span>
    <button class="btn-open-app" id="btn-open-gui">
      <span>⚡ Open Pew App</span>
    </button>
  </div>

  <div class="media-list" id="media-list">
    <!-- Items dynamically inserted -->
  </div>

  <div class="empty-box" id="empty-box">
    <div class="empty-icon">🎬</div>
    <p>No video or audio detected on this page.<br>Play a video to catch it automatically!</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
