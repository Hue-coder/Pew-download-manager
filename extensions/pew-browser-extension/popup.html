<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pew Media Grabber</title>
  <style>
    :root {
      --bg-app: #0e0f16;
      --bg-header: #12131d;
      --bg-card: #181926;
      --bg-card-hover: #202235;
      --border-color: #232537;
      
      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-purple: #7c3aed;
      --accent-indigo: #6366f1;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;

      --grad-primary: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
      --grad-brand: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      --shadow-purple: 0 4px 14px rgba(124, 58, 237, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #282a3d; border-radius: 4px; }

    /* Header matching ABDM */
    .header {
      padding: 11px 16px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-svg {
      width: 22px;
      height: 22px;
      filter: drop-shadow(0 0 6px rgba(129, 140, 248, 0.5));
    }

    .brand-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.2px;
    }

    .app-status {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-online {
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
    }

    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }

    /* ABDM Action Banner */
    .app-banner {
      padding: 8px 14px;
      background: #141522;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .banner-text {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .btn-open-app {
      background: var(--grad-primary);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-purple);
      transition: filter 0.15s, transform 0.1s;
    }

    .btn-open-app:hover {
      filter: brightness(1.15);
    }

    .btn-open-app:active {
      transform: scale(0.98);
    }

    /* Intercept Setting Bar */
    .intercept-bar {
      padding: 7px 14px;
      background: #11121d;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .intercept-label {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 30px;
      height: 17px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2b2e44;
      border-radius: 17px;
      transition: .2s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 13px;
      width: 13px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      border-radius: 50%;
      transition: .2s;
    }

    .switch input:checked + .slider {
      background-color: var(--accent-purple);
    }

    .switch input:checked + .slider:before {
      transform: translateX(13px);
    }

    /* Tabs Bar */
    .tabs-bar {
      display: flex;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 5px 10px;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 500;
      font-family: inherit;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: #25233b;
      color: #c084fc;
      font-weight: 600;
      border: 1px solid rgba(124, 58, 237, 0.3);
    }

    /* Media List & Cards */
    .media-list {
      padding: 10px;
      max-height: 440px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .media-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 9px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: border-color 0.2s, background 0.15s;
    }

    .media-card:hover {
      border-color: rgba(129, 140, 248, 0.4);
      background: var(--bg-card-hover);
    }

    .media-title {
      font-size: 12px;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tag-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tag-quality {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      color: #fff;
    }

    .tag-format {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1b1c2b;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .tag-size {
      font-size: 11px;
      font-family: monospace;
      color: #38bdf8;
      font-weight: 600;
    }

    .save-to {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-group {
      display: flex;
      gap: 6px;
      margin-top: 3px;
    }

    .btn-dl {
      flex: 1;
      background: var(--grad-primary);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: var(--shadow-purple);
      transition: filter 0.15s, transform 0.1s;
    }

    .btn-dl:hover {
      filter: brightness(1.15);
    }

    .btn-dl:active {
      transform: scale(0.98);
    }

    .btn-copy {
      background: #212334;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-copy:hover {
      background: #2b2e44;
      color: #fff;
    }

    /* Empty State */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .empty-icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
    }

    .empty-svg {
      width: 24px;
      height: 24px;
      color: #818cf8;
    }

    .empty-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .empty-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" class="brand-svg">
        <circle cx="12" cy="12" r="10" stroke="url(#popBrandGrad)" stroke-width="2.2"/>
        <path d="M12 7V15M12 15L8.5 11.5M12 15L15.5 11.5M8 17H16" stroke="url(#popBrandGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="popBrandGrad" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
            <stop stop-color="#38bdf8"/>
            <stop offset="0.5" stop-color="#818cf8"/>
            <stop offset="1" stop-color="#c084fc"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="brand-title">Pew Media Grabber</span>
    </div>
    <div class="app-status status-offline" id="app-status-badge">
      <span class="status-dot"></span>
      <span id="app-status-text">Checking...</span>
    </div>
  </div>

  <div class="app-banner">
    <span class="banner-text">Desktop Accelerator</span>
    <button class="btn-open-app" id="btn-open-gui">
      <span>🖥️ Open Pew App</span>
    </button>
  </div>

  <div class="intercept-bar">
    <span class="intercept-label">📦 Catch Browser Files (.zip, .exe)</span>
    <label class="switch" title="Toggle automatic interception of browser ZIP/EXE downloads">
      <input type="checkbox" id="toggle-intercept">
      <span class="slider"></span>
    </label>
  </div>

  <div class="tabs-bar">
    <button class="tab-btn active" data-tab="all">All</button>
    <button class="tab-btn" data-tab="video">🎬 Video (4K/2K/1080p)</button>
    <button class="tab-btn" data-tab="audio">🎵 Audio (MP3/WAV)</button>
  </div>

  <div class="empty-state" id="empty-box">
    <div class="empty-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="empty-svg">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    </div>
    <div class="empty-title">Detecting Media...</div>
    <div class="empty-desc">Open any video on YouTube, Pinterest, Facebook, or streaming sites to grab all 4K/2K/1080p & Audio formats.</div>
  </div>

  <div class="media-list" id="media-list" style="display: none;"></div>

  <script src="popup.js"></script>
</body>
</html>
