<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pew Media Grabber</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .header {
      padding: 12px 16px;
      background: #070a12;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      font-size: 18px;
      color: #06b6d4;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .status-pill {
      font-size: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .media-list {
      padding: 10px;
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .media-card {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .media-card:hover {
      border-color: #06b6d4;
    }
    .media-title {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .tag-group {
      display: flex;
      gap: 6px;
    }
    .tag {
      background: rgba(6, 182, 212, 0.15);
      color: #38bdf8;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .size {
      color: #94a3b8;
    }
    .action-group {
      display: flex;
      gap: 6px;
    }
    .btn-dl {
      flex: 1;
      background: #06b6d4;
      color: #041017;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-dl:hover { background: #38bdf8; }
    .btn-copy {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-copy:hover { background: #334155; color: #fff; }
    .empty-box {
      padding: 40px 20px;
      text-align: center;
      color: #64748b;
    }
    .empty-icon { font-size: 32px; margin-bottom: 8px; }
    .empty-box p { font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-title">Pew Grabber</span>
    </div>
    <span class="status-pill" id="media-count-badge">0 Media</span>
  </div>

  <div class="media-list" id="media-list">
    <!-- Items dynamically inserted -->
  </div>

  <div class="empty-box" id="empty-box">
    <div class="empty-icon">🎬</div>
    <p>No video or audio detected on this page.<br>Play a video to catch it automatically!</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
