<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pew Media Grabber</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .header {
      padding: 12px 16px;
      background: #070a12;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      font-size: 18px;
      color: #06b6d4;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .app-status {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    
    .app-banner {
      padding: 8px 12px;
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.15), rgba(139, 92, 246, 0.15));
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .banner-text {
      font-size: 11px;
      color: #94a3b8;
    }
    .btn-open-app {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #ffffff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: filter 0.2s;
    }
    .btn-open-app:hover {
      filter: brightness(1.15);
    }

    .tabs-bar {
      display: flex;
      background: #070a12;
      border-bottom: 1px solid #1e293b;
      padding: 4px 8px;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      background: rgba(6, 182, 212, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .media-list {
      padding: 10px;
      max-height: 440px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .media-card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s;
    }
    .media-card:hover {
      border-color: rgba(6, 182, 212, 0.4);
      background: #131d31;
    }
    .media-title {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tag-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tag-quality {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: #06b6d4;
      color: #041017;
    }
    .tag-format {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
    }
    .tag-size {
      font-size: 11px;
      font-family: monospace;
      color: #38bdf8;
      font-weight: 600;
    }
    .save-to {
      font-size: 10px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .action-group {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .btn-dl {
      flex: 1;
      background: #06b6d4;
      color: #041017;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-dl:hover {
      background: #38bdf8;
    }
    .btn-copy {
      background: #1e293b;
      color: #94a3b8;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-copy:hover {
      background: #334155;
      color: #fff;
    }

    .empty-state {
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .empty-icon {
      font-size: 28px;
      color: #475569;
    }
    .empty-title {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
    }
    .empty-desc {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
    }

    .intercept-bar {
      padding: 6px 12px;
      background: #080d1a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .intercept-label {
      font-size: 10px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 28px;
      height: 16px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      border-radius: 16px;
      transition: .2s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      border-radius: 50%;
      transition: .2s;
    }
    .switch input:checked + .slider {
      background-color: #06b6d4;
    }
    .switch input:checked + .slider:before {
      transform: translateX(12px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-title">Pew Media Grabber</span>
    </div>
    <div class="app-status status-offline" id="app-status-badge">
      <span class="status-dot"></span>
      <span id="app-status-text">Checking...</span>
    </div>
  </div>

  <div class="app-banner">
    <span class="banner-text">Desktop Accelerator</span>
    <button class="btn-open-app" id="btn-open-gui">
      <span>🖥️ Open Pew App</span>
    </button>
  </div>

  <div class="intercept-bar">
    <span class="intercept-label">📦 Catch Browser Files (.zip, .exe)</span>
    <label class="switch" title="Toggle automatic interception of browser ZIP/EXE downloads">
      <input type="checkbox" id="toggle-intercept">
      <span class="slider"></span>
    </label>
  </div>

  <div class="tabs-bar">
    <button class="tab-btn active" data-tab="all">All</button>
    <button class="tab-btn" data-tab="video">🎬 Video (4K/2K/1080p)</button>
    <button class="tab-btn" data-tab="audio">🎵 Audio (MP3/WAV)</button>
  </div>

  <div class="empty-state" id="empty-box">
    <div class="empty-icon">⚡</div>
    <div class="empty-title">Detecting Media...</div>
    <div class="empty-desc">Open any video on YouTube, Facebook, Twitter, or streaming sites to grab all 4K/2K/1080p & Audio formats.</div>
  </div>

  <div class="media-list" id="media-list" style="display: none;"></div>

  <script src="popup.js"></script>
</body>
</html>
