name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build Windows Release & Extension
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Standalone Media Tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "crates/pew-gui/bin"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "crates/pew-gui/bin/yt-dlp.exe"

      - name: Build Tauri Installers and Release Binary
        shell: pwsh
        run: |
          Set-Location "crates/pew-gui"
          npx @tauri-apps/cli build

      - name: Package Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_artifacts"
          Copy-Item "target/release/pew-gui.exe" -Destination "release_artifacts/pew-gui.exe"
          if (Test-Path "crates/pew-gui/bin") {
            Copy-Item "crates/pew-gui/bin" -Destination "release_artifacts" -Recurse -Force
          }
          
          # Compress standalone desktop app into ZIP
          Compress-Archive -Path "release_artifacts/*" -DestinationPath "Pew-Download-Manager-Windows-x64.zip" -Force
          
          # Compress browser extension into clean installable ZIP
          Compress-Archive -Path "extensions/pew-browser-extension/*" -DestinationPath "pew-browser-extension.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Pew Download Manager ${{ github.ref_name }}"
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            Pew-Download-Manager-Windows-x64.zip
            pew-browser-extension.zip
          generate_release_notes: true
          draft: false
          prerelease: false
