name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build Windows Release & Extension
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Optimized Release Binary
        run: |
          cargo build --release -p pew-gui

      - name: Package Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_artifacts"
          Copy-Item "target/release/pew-gui.exe" -Destination "release_artifacts/pew-gui.exe"
          
          # Compress standalone desktop app into ZIP
          Compress-Archive -Path "release_artifacts/pew-gui.exe" -DestinationPath "Pew-Download-Manager-Windows-x64.zip" -Force
          
          # Compress browser extension into clean installable ZIP
          Compress-Archive -Path "extensions/pew-browser-extension/*" -DestinationPath "pew-browser-extension.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Pew Download Manager ${{ github.ref_name }}"
          files: |
            Pew-Download-Manager-Windows-x64.zip
            pew-browser-extension.zip
          generate_release_notes: true
          draft: false
          prerelease: false
